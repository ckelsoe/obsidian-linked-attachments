# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Review once when a PR opens; do not re-review on every push. Batch fixes,
# then comment `@coderabbitai full review` to request the final pass.
# Release/metadata PRs (titled "Release ...") are skipped: they only bump the
# version + CHANGELOG, and the release workflow (attestation + scan) is their gate.
reviews:
  auto_review:
    enabled: true
    auto_incremental_review: false
    drafts: false
    ignore_title_keywords:
      - "Release"
  # Docstring coverage as a non-blocking SIGNAL, not a merge gate. The check
  # counts only JSDoc `/** */` blocks, and these plugins document with `//` line
  # comments by convention, so the raw score under-reports. "warning" keeps the
  # number visible as a nudge to add docstrings on exported/shared surfaces
  # (cookbook components, cross-plugin helpers) without flipping an otherwise
  # clean review to CHANGES_REQUESTED and blocking merge under branch protection.
  # Repo config overrides the org UI setting.
  pre_merge_checks:
    docstrings:
      mode: "warning"
